name: Run DB Migration

# Manual, on-demand. Actions tab -> "Run DB Migration" -> Run workflow ->
# pick the command. Builds the migrator image (dev deps + source) and runs
# the chosen TypeORM/seed script against the host Postgres on the server.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run"
        type: choice
        default: "migration:run"
        options:
          - "migration:run"
          - "migration:revert"
          - "seed:initial"
          - "seed:all"

env:
  IMAGE: ghcr.io/upc-abet/back-acreditacion-3.0

jobs:
  build-migrator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.IMAGE }}:migrator
          cache-from: type=gha
          cache-to: type=gha,mode=max

  run-migration:
    needs: build-migrator
    runs-on: ubuntu-latest
    steps:
      - name: Run "${{ inputs.command }}" on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker pull ghcr.io/upc-abet/back-acreditacion-3.0:migrator
            CMD="${{ inputs.command }}"
            docker run --rm \
              --env-file /var/www/apps/sys_acc_back/.env \
              --add-host host.docker.internal:host-gateway \
              ghcr.io/upc-abet/back-acreditacion-3.0:migrator \
              pnpm $CMD
            docker logout ghcr.io

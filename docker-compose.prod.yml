# ABET Backend — production compose (image pulled from GHCR).
# Runtime secrets come from the server-side .env next to this file.
# Postgres runs on the HOST (see startup-abet script), reached via host-gateway.

services:
  sys_acc_back:
    image: ghcr.io/upc-abet/back-acreditacion-3.0:latest
    container_name: sys_acc_back
    restart: unless-stopped
    mem_limit: 640m
    memswap_limit: 1024m
    env_file:
      - .env
    ports:
      # Exposed only on localhost; Nginx reverse-proxies to it.
      - '127.0.0.1:7777:7777'
    extra_hosts:
      # Lets the container reach the host's PostgreSQL via host.docker.internal
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./scrapping:/data/banner
    networks:
      - sys_acc_web

  # Streamed-login browser. Private to sys_acc_web — no ports
  # published; reached only through sys_acc_back's authenticated wss proxy.
  # Shares the auth_state.json volume with the backend (writes it; backend reads).
  browser-auth:
    image: ghcr.io/upc-abet/back-acreditacion-3.0:browser-auth
    container_name: browser-auth
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 896m
    shm_size: 256m
    volumes:
      - ./scrapping:/data/banner
    networks:
      - sys_acc_web

networks:
  sys_acc_web:
    external: true
